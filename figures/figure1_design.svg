<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="180mm" height="93.0mm" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect width="720" height="372" fill="#ffffff"/>
<text x="1" y="13" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">a</text>
<text x="17" y="13" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Stability probing</text>
<rect x="1" y="26" width="236" height="40" rx="3" fill="#f6f6f4" stroke="#c9c9c6" stroke-width="0.75"/>
<text x="11" y="42" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Factual question, closed book</text>
<text x="11" y="56" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">TriviaQA and PopQA; 6,000 facts per model</text>
<text x="1" y="86" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="start">6 prompt variants, one sampled answer each</text>
<text x="1" y="98" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">temperature 0.7; bar length = answer length, fill = answer</text>
<text x="5" y="119.2" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">P1</text>
<rect x="27" y="112" width="62" height="8" rx="4" fill="#4a5568" stroke="#4a5568" stroke-width="0.9"/>
<text x="5" y="134.2" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">P2</text>
<rect x="27" y="127" width="24" height="8" rx="4" fill="#4a5568" stroke="#4a5568" stroke-width="0.9"/>
<text x="5" y="149.2" font-size="8.5" font-weight="400" fill="#8c8c8c" text-anchor="start">P3</text>
<rect x="27" y="142" width="24" height="8" rx="4" fill="#ffffff" stroke="#8c8c8c" stroke-width="0.7" stroke-dasharray="2 2"/>
<text x="5" y="164.2" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">P4</text>
<rect x="27" y="157" width="62" height="8" rx="4" fill="#4a5568" stroke="#4a5568" stroke-width="0.9"/>
<text x="5" y="179.2" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">P5</text>
<rect x="27" y="172" width="24" height="8" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="0.9"/>
<text x="5" y="194.2" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">P6</text>
<rect x="27" y="187" width="24" height="8" rx="4" fill="#4a5568" stroke="#4a5568" stroke-width="0.9"/>
<text x="57" y="149" font-size="7.6" font-weight="400" fill="#8c8c8c" text-anchor="start" font-style="italic">held out</text>
<path d="M97,111 h5 v85 h-5" fill="none" stroke="#8c8c8c" stroke-width="0.75"/>
<line x1="102" y1="153.5" x2="109" y2="153.5" stroke="#8c8c8c" stroke-width="0.75"/>
<text x="113" y="114.0" font-size="8.3" font-weight="400" fill="#555555" text-anchor="start">Leave one prompt out: share</text>
<text x="113" y="124.6" font-size="8.3" font-weight="400" fill="#555555" text-anchor="start">of the other five answers that</text>
<text x="113" y="135.2" font-size="8.3" font-weight="400" fill="#555555" text-anchor="start">give their most common answer</text>
<text x="113" y="145.8" font-size="8.3" font-weight="400" fill="#555555" text-anchor="start">(compared by meaning, not by</text>
<text x="113" y="156.4" font-size="8.3" font-weight="400" fill="#555555" text-anchor="start">wording or length), averaged</text>
<text x="113" y="167.0" font-size="8.3" font-weight="400" fill="#555555" text-anchor="start">over the six folds</text>
<text x="113" y="188" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="start">= support, s ∈ [0, 1]</text>
<text x="1" y="224" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Three quantities per fact</text>
<rect x="1" y="236" width="236" height="36" rx="3" fill="#ffffff" stroke="#c9c9c6" stroke-width="0.75"/>
<circle cx="18" cy="254" r="9.5" fill="#f6f6f4" stroke="#c9c9c6" stroke-width="0.75"/>
<text x="18" y="257.5" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle" font-style="italic">s</text>
<text x="35" y="249" font-size="9" font-weight="700" fill="#1a1a1a" text-anchor="start">Stability (support)</text>
<text x="35" y="259" font-size="8" font-weight="400" fill="#555555" text-anchor="start">leave-one-prompt-out agreement of answers;</text>
<text x="35" y="268" font-size="8" font-weight="400" fill="#555555" text-anchor="start">computed without reference to correctness</text>
<rect x="1" y="278" width="236" height="36" rx="3" fill="#ffffff" stroke="#c9c9c6" stroke-width="0.75"/>
<circle cx="18" cy="296" r="9.5" fill="#f6f6f4" stroke="#c9c9c6" stroke-width="0.75"/>
<text x="18" y="299.5" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle" font-style="italic">c</text>
<text x="35" y="291" font-size="9" font-weight="700" fill="#1a1a1a" text-anchor="start">Correctness</text>
<text x="35" y="301" font-size="8" font-weight="400" fill="#555555" text-anchor="start">at least half of the six answers</text>
<text x="35" y="310" font-size="8" font-weight="400" fill="#555555" text-anchor="start">contain the reference answer</text>
<rect x="1" y="320" width="236" height="36" rx="3" fill="#ffffff" stroke="#c9c9c6" stroke-width="0.75"/>
<circle cx="18" cy="338" r="9.5" fill="#f6f6f4" stroke="#c9c9c6" stroke-width="0.75"/>
<text x="18" y="341.5" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle" font-style="italic">h</text>
<text x="35" y="333" font-size="9" font-weight="700" fill="#1a1a1a" text-anchor="start">Hidden state</text>
<text x="35" y="343" font-size="8" font-weight="400" fill="#555555" text-anchor="start">last token of a separate greedy answer (≤ 24</text>
<text x="35" y="352" font-size="8" font-weight="400" fill="#555555" text-anchor="start">tokens); four depths, 40–100% of layers</text>
<path d="M243,150 h10 m-4,-4 l4,4 l-4,4" fill="none" stroke="#8c8c8c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="262" y="13" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">b</text>
<text x="278" y="13" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Correctness × stability design</text>
<rect x="288" y="44" width="92" height="84" rx="3" fill="#d6e4ef" stroke="none" stroke-width="0.75"/>
<rect x="286.5" y="42.5" width="95" height="87" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="296" y="62.0" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Correct,</text>
<text x="296" y="73.5" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="start">unstable</text>
<text x="296" y="94.0" font-size="7.6" font-weight="400" fill="#555555" text-anchor="start">right answer that</text>
<text x="296" y="103.5" font-size="7.6" font-weight="400" fill="#555555" text-anchor="start">varies with wording</text>
<rect x="384" y="44" width="92" height="84" rx="3" fill="#2f6f9f" stroke="none" stroke-width="0.75"/>
<text x="392" y="62.0" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="start">Correct,</text>
<text x="392" y="73.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="start">stable</text>
<text x="392" y="94.0" font-size="7.6" font-weight="400" fill="#ffffff" text-anchor="start">reliable parametric</text>
<text x="392" y="103.5" font-size="7.6" font-weight="400" fill="#ffffff" text-anchor="start">knowledge</text>
<rect x="288" y="132" width="92" height="84" rx="3" fill="#f3dcd5" stroke="none" stroke-width="0.75"/>
<text x="296" y="150.0" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Incorrect,</text>
<text x="296" y="161.5" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="start">unstable</text>
<text x="296" y="182.0" font-size="7.6" font-weight="400" fill="#555555" text-anchor="start">wrong answer that</text>
<text x="296" y="191.5" font-size="7.6" font-weight="400" fill="#555555" text-anchor="start">varies with wording</text>
<rect x="384" y="132" width="92" height="84" rx="3" fill="#c1553b" stroke="none" stroke-width="0.75"/>
<rect x="382.5" y="130.5" width="95" height="87" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="392" y="150.0" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="start">Incorrect,</text>
<text x="392" y="161.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="start">stable</text>
<text x="392" y="182.0" font-size="7.6" font-weight="400" fill="#ffffff" text-anchor="start">stably incorrect: the</text>
<text x="392" y="191.5" font-size="7.6" font-weight="400" fill="#ffffff" text-anchor="start">same error throughout</text>
