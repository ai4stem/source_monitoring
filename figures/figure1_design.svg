<text x="430.0" y="238" font-size="8.5" font-weight="400" fill="#555555" text-anchor="middle">high</text>
<text x="382" y="251" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Stability (support, s)</text>
<text x="283" y="86.0" font-size="8.5" font-weight="400" fill="#555555" text-anchor="middle" transform="rotate(-90 283 86.0)">correct</text>
<text x="283" y="174.0" font-size="8.5" font-weight="400" fill="#555555" text-anchor="middle" transform="rotate(-90 283 174.0)">incorrect</text>
<text x="270" y="130" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 270 130)">Correctness (c)</text>
<rect x="262" y="263" width="12" height="9" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="280" y="271" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">Off-diagonal cells separate correctness from</text>
<text x="280" y="282" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">stability; contrasting only the diagonal cells</text>
<text x="280" y="293" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">(stable-correct versus unstable-incorrect)</text>
<text x="280" y="304" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">confounds the two.</text>
<text x="262" y="324" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">Stably incorrect facts (all six answers agree on</text>
<text x="262" y="335" font-size="8.5" font-weight="400" fill="#555555" text-anchor="start">a wrong answer): 77–386 per model.</text>
